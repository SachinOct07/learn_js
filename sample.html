<html>
    <head>
        <title>Practice</title>
    </head>
    <body>
        Num1: <input type="number" id="num1" ><br>
        Num2: <input type="number" id="num2" ><br>
        <button onclick="change()">Add</button>
        <p id="res">Result</p>
        <script>
            
            function change(){
                var n1 = document.getElementById("num1")
                var n2 = document.getElementById("num2")
                var res1= document.getElementById("res")
                var n1v = Number(n1.value)
                var n2v = Number(n2.value)
                var tot = n1v + n2v
                res1.textContent = tot 
            }
        </script>
    </body>
</html>
