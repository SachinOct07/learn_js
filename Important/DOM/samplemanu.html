<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      width: 300px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    ol {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <input type="text" placeholder="Enter text">
    <button onclick="manipulateDOM()">Click me</button>
    <ol>
      <li>Item-1</li>
      <li>Item-2</li>
      <li>Item-3</li>
    </ol>
  </div>

  <script src="manipulating.js"></script>
</body>
</html>
